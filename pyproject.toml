[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evalstats"
version = "0.1.0"
description = "Significance-aware comparison of language-model evaluation results: standard errors, paired tests, multiple-comparison correction, and a plain-language verdict."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "evalstats contributors" }]
keywords = ["llm", "evaluation", "benchmark", "statistics", "significance", "confidence-interval"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "typer>=0.12",
]

[project.optional-dependencies]
report = ["matplotlib>=3.7"]
lighteval = ["pyarrow>=14"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "pyarrow>=14"]

[project.scripts]
evalstats = "evalstats.cli:app"

[project.urls]
Homepage = "https://github.com/your-username/evalstats"
Issues = "https://github.com/your-username/evalstats/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/evalstats"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
